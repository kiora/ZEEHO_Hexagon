[rewrite_local]
# 捕获原生轨迹请求认证，不改写请求。
^https://tapi\.zeehoev\.com/v1\.0/app/cfmotoserverapp/ridetrack_v2(?:\?.*)?$ url script-request-header ZEEHO_Hexagon.js
# 六项统计显示。
^https://tapi\.zeehoev\.com/v1\.0/app/cfmotoserverapp/(?:vehicle/list|vehicleHomePageV2/[^?#]*)(?:\?.*)?$ url script-response-body ZEEHO_Hexagon.js
# 轨迹估算、日/月缓存及雷达。
^https://tapi\.zeehoev\.com/v1\.0/app/cfmotoserverapp/(?:ridetrack_v2|myRideInfo|analyse/analyse)(?:\?.*)?$ url script-response-body ZEEHO_Hexagon.js

[mitm]
hostname = tapi.zeehoev.com

[task_local]
# 每 15 分钟执行一次；每次最多读取一页，iOS 实际调度可能延迟。
*/15 * * * * ZEEHO_Hexagon.js, tag=ZEEHO 自动按月缓存, enabled=true
